<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="playground-job" content="ympzy7z2aiigxfz7w7wa"><meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Tip Calculator</h1>
  <form id="form" novalidate="">
    <label for="bill">Bill amount</label>
    <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autofocus="">
    <p id="error" class="error" role="alert"></p>

    <label id="tip-label">Tip percentage</label>
    <div class="chips" id="chips" role="group" aria-labelledby="tip-label"></div>
    <div class="custom">
      <label for="custom">Custom %</label>
      <input id="custom" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 12">
    </div>

    <label for="people">Split between</label>
    <input id="people" type="number" inputmode="numeric" min="1" step="1" value="1">
  </form>

  <section class="results" aria-live="polite">
    <div><span>Tip</span><strong id="tip">$0.00</strong></div>
    <div><span>Total</span><strong id="total">$0.00</strong></div>
    <div id="per-row" hidden=""><span>Per person</span><strong id="per">$0.00</strong></div>
  </section>
</main>
<script src="app.js"></script>
